# ツールの定義。どのエージェントに持たせるかは agents.yaml に書く。
# ツールの実装は、library/network.py の LocalTools に同じ名前で渡す。
# 長い evaluation は prompts/tools/<名前>/evaluation.md に置いている。
# 書ける項目を全部埋めた見本（sample_tool）が末尾にある。ツールを足すときはそこからコピーする。

- name: search_rules
  summary: 図書館の利用規程を検索する
  # 「必ず最初に実行すること」とは書かない。
  # 最初の1回は initial_tools としてシステムが実行済みで、
  # ここに残るのは「別の主題で調べ直したくなった時」の使い方だけ。
  usage: 別の主題の規程も必要になった場合に実行する。
  # 実行中に利用者の画面へ出す文言。{名前} には実行時の引数が入る。
  # 渡さなければ「search_rulesをtopic='貸出'で実行しています...」という開発者向けの既定文になる。
  execution_message: 「{topic}」について利用規程を確認しています...
  parameters:
    type: object
    properties:
      topic: {type: string, description: 何について調べるか}
    required: [topic]

# agents.yaml の tools へは登録しない（initial_tools だけ）ので、LLMからはカタログにも
# 候補にも出ない。実行するのはシステムだけで、呼び直すこともできない。
- name: fetch_member_status
  summary: 会員番号から会員区分を引く
  # evaluationが流れるのは結果が返ってきた時だけ。実行されなかった場合は届かないので、
  # ここに「取得できなかった時の扱い」は書かない。
  evaluation: |-
    会員区分は貸出可能冊数と貸出期間の条件に直結する。区分が分かったら、その区分での結論を記録する。
  execution_message: 会員情報を確認しています...
  parameters:
    type: object
    properties:
      member_id: {type: string, description: 利用者の会員番号}
    required: [member_id]

# 利用者に選んでもらうツール。候補が複数あると、ここで依頼全体が止まる（suspend）。
# 入口（cli.py / chat.py / api.py）が利用者へ候補を見せ、答えが届いたら続きから進める。
# 答えはそのまま、このツールの結果になる（関数は呼び直されない）ので、その読み方を evaluation に書く。
- name: identify_title
  summary: 書名の一部や著者名から蔵書を探し、書名を1つに確定する
  usage: 正確な書名が分からない時に実行する。候補が複数あれば、利用者がその場で選ぶ。
  evaluation: |-
    候補が1つなら、その書名が返る。複数あった場合は利用者が選び、その返答がそのまま結果になる。
    候補のどれでもない返答（取りやめる、など）は、利用者の意向としてそのまま読む。
  execution_message: 「{keyword}」に当たる蔵書を探しています...
  parameters:
    type: object
    properties:
      keyword: {type: string, description: 書名か著者名に含まれる語（部分一致で探す）}
    required: [keyword]

# 調べている途中のまま、利用者に尋ねるツール。ここでも依頼全体が止まる（suspend）。
# 受付に聞き返してもらう形と違い、それまでに調べたことを捨てずに続けられる。
- name: ask_member
  summary: 利用者にしか分からないことを、利用者に尋ねる
  usage: "依頼に無い情報のうち、利用者にしか分からず、それが無いと先へ進めないものを尋ねる。\
    1回に尋ねることは1つにし、利用者が答えられる言葉で書く。\
    書名の候補から選んでもらうのは identify_title で行う。"
  evaluation: |-
    結果は利用者の返答そのもの。値はそのまま使い、形を整えたり補ったりしない。
    尋ねたことに答えていない返答は、利用者の意向としてそのまま読む。
  execution_message: 利用者に確認しています...
  parameters:
    type: object
    properties:
      question: {type: string, description: 利用者に尋ねる文。利用者の画面にそのまま出る}
    required: [question]

- name: check_stock
  summary: 書名から所在と貸出状況を調べる
  execution_message: 『{title}』の所蔵状況を照会しています...
  parameters:
    type: object
    properties:
      title: {type: string, description: 調べたい書名（正確な書名）}
    required: [title]

- name: issue_reservation
  summary: 予約を登録し受付番号を発行する
  usage: 貸出中の資料に対してのみ実行する。会員番号が不明な場合は実行しない。
  # member_id も差し込めるが、画面に出す必要がないので出さない。
  # 引数を全部受け取れることと、全部出すことは別。
  execution_message: 『{title}』の予約を登録しています...
  parameters:
    type: object
    properties:
      title: {type: string, description: 予約する書名}
      member_id: {type: string, description: 利用者の会員番号}
    required: [title, member_id]

# execution_message を渡さない例。既定の汎用文が使われる。全部に文言を用意する必要はない。
- name: send_overdue_notice
  summary: 延滞者へ督促メールを送信する
  usage: 延滞の事実が確認できている場合にのみ実行する。
  parameters:
    type: object
    properties:
      member_id: {type: string, description: 督促対象の会員番号}
    required: [member_id]

# ---- 設定できる全項目の見本 ----
# ツールを足すときは、ここをコピーして、要らない項目を消してから中身を書き換える。
#
# この見本も読み込まれる（知らない項目名は読み込みの時点でエラーになる）。
# 実装は tools.py の sample_tool。agents.yaml の sample_agent だけが使う。
#
# 長い文章（usage / evaluation / execution_message）は、YAML に書く代わりに
# prompts/tools/<名前>/<項目>.md に置ける（両方に書くとエラー）。
- name: sample_tool             # LLM に見せる名前
  summary: 見本のツール。最大3件を返す        # 使える全員に常時見える1行
  usage: このツールを持つエージェントにだけ見える使い方
  evaluation: 結果が返ってきた時に1回だけ添える、結果の読み方
  # {名前} は、実行時の引数で埋まる
  execution_message: 「{topic}」を調べています...
  parameters:                   # 引数の JSON Schema。書いたものがそのまま LLM へ渡る
    type: object
    properties:
      topic:
        type: string
        description: 何について調べるか。結果は最大3件
    required: [topic]
