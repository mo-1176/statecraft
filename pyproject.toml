[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statecraft"
version = "0.6.1"
description = "記憶を構造として扱うマルチエージェントフレームワーク"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Masaki Ohta" }
]
keywords = [
    "llm",
    "agent",
    "multi-agent",
    "agent-framework",
    "react",
    "memory",
    "gemini",
    "openai",
    "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Natural Language :: Japanese",
    "Typing :: Typed",
]
# 設定ファイル（config.py）の読み込みに使う。
#   pydantic 2.0 … TypeAdapter / model_validator / ConfigDict（1.x には無い）
#   pyyaml   6.0 … safe_load しか使わない。下限は今の系列に合わせただけ
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

# 下限は「このフレームワークが実際に呼んでいるAPIが入ったバージョン」。
#   google-genai 1.51.0 … types.ThinkingConfig(thinking_level=...)
#   openai       2.45.0 … responses.create の prompt_cache_options（キャッシュの区切り）
#                         Azure の Entra ID で使う、関数の api_key は 1.106.0 から
#   anthropic    0.78.0 … messages の thinking={"type": "adaptive"}
# これより古いSDKでは、生成時にTypeErrorか不正なリクエストになる。
# Azure OpenAI は openai の SDK で繋ぐ（AzureOpenAILLM）。Entra ID で認証する場合の
# azure-identity は、トークンを作る利用側が入れる。
[project.optional-dependencies]
gemini = ["google-genai>=1.51.0"]
openai = ["openai>=2.45.0"]
claude = ["anthropic>=0.78.0"]
all = [
    "statecraft[gemini,openai,claude]",
]
# テストを動かすためだけの依存。LLMのAPIは呼ばないので、SDKは要らない。
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/masakiohta-1176/statecraft"
Repository = "https://github.com/masakiohta-1176/statecraft"
Issues = "https://github.com/masakiohta-1176/statecraft/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/statecraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ を import の探索先に入れる。conftest.py の FakeLLM を
# 各テストが `from conftest import ...` で使うため。
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# 規則はRuffの既定のまま。BLE001（except Exception）はフレームワークの境界
# ——利用者が書いたtool本体・interceptorのコールバック・メッセージテンプレート
# ——を呼ぶ箇所で意図的に使っているため、規則自体は有効にしたまま、該当行へ
# 個別にnoqaを置いている（どこで何を握るかが差分に残る）。
#
# RUF100は、その置き忘れ・置きっぱなしを検出するために足している。
extend-select = ["RUF100"]

[tool.ruff.lint.isort]
# examples/ の入口が読み込むサンプルのパッケージ。外部パッケージと分けて並べる
known-local-folder = ["library"]
